<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research Project | Mapping the Magic</title>
<style>
  /* --- GLOBAL RESET --- */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f9f9;
    --text: #1e1e1e;
    --accent: #7c3aed;
    --card: #ffffff;
    --muted: #555;
    --border: #e0e0e0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --text: #eaeaea;
      --accent: #a78bfa;
      --card: #1d1d1d;
      --muted: #aaa;
      --border: #333;
    }
  }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
  }

  header {
    text-align: center;
    padding: 3rem 1rem 2rem;
    background: linear-gradient(135deg, var(--accent), #4f46e5);
    color: white;
    border-bottom: 4px solid var(--accent);
  }

  header h1 {
    font-size: 2rem;
    max-width: 800px;
    margin: 0 auto;
  }

  main {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  section {
    margin-bottom: 3rem;
  }

  h2, h3 {
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  p, li {
    margin-bottom: 0.75rem;
  }

  /* --- CARD STYLE --- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  }

  .meta { color: var(--muted); font-size: 0.95rem; margin-bottom: 1rem; }
  .grid { display: grid; gap: 1rem; }
  @media (min-width:700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
  .word-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .badge {
    background: var(--accent);
    color: white;
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }

  /* --- IMAGE GALLERY --- */
  .image-gallery {
    margin-top: 3rem;
  }
  .image-gallery h2 { text-align: center; margin-bottom: 1.5rem; color: var(--accent); }
  .gallery-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
    justify-items: center;
  }
  .gallery-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    width: 100%;
    max-width: 400px;
    cursor: pointer;
  }
  .gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }
  .gallery-item img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 0.75rem;
    display: block;
  }
  .gallery-item figcaption { color: var(--muted); font-size: 0.95rem; line-height: 1.4; }

  /* --- LIGHTBOX --- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 1.5rem;
  }
  .lightbox.active { display: flex; }
  .lightbox-content {
    position: relative;
    max-width: min(90vw, 900px);
    max-height: 90vh;
  }
  .lightbox-content img {
    width: 100%;
    height: auto;
    border-radius: 12px;
  }
  .lightbox-caption {
    margin-top: 0.75rem;
    text-align: center;
    color: #fff;
    font-size: 0.95rem;
  }
  .lightbox-close {
    position: absolute;
    top: -14px;
    right: -14px;
    background: rgba(0,0,0,0.65);
    border: none;
    color: #fff;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
  }

  footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  iframe {
    width: 100%;
    height: 300px;
    border: none;
    border-radius: 10px;
    margin-bottom: 2rem;
  }
</style>
</head>
<body>

<header>
  <h1>Mapping the Magic: A Digital Analysis of the Evolution of Fantasy Literature</h1>
</header>

<main>
  <!-- Voyant section stays identical -->
  <!-- ... (same as before) ... -->

  <!-- Image Gallery -->
  <section class="image-gallery">
    <h2>Project Images</h2>
    <div class="gallery-row">
      <figure class="gallery-item" data-img="graphdata.jpg" data-caption="Relative Frequencies Graph">
        <img src="graphdata.jpg" alt="Line graph showing relative frequencies by document corpus" />
        <figcaption>Relative Frequencies Graph</figcaption>
      </figure>
      <figure class="gallery-item" data-img="fantasywordcloud.jpg" data-caption="Fantasy Literature Word Cloud">
        <img src="fantasywordcloud.jpg" alt="Word cloud for fantasy literature corpus" />
        <figcaption>Fantasy Literature Word Cloud</figcaption>
      </figure>
    </div>
  </section>

  <!-- Abstract and Works Cited sections (same as before) -->
</main>

<footer>
  &copy; 2025 Michael Haney | Digital Humanities Portfolio
</footer>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close image">&times;</button>
    <img src="" alt="" id="lightbox-img">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</div>

<script>
  const galleryItems = document.querySelectorAll('.gallery-item');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');
  const lightboxClose = document.getElementById('lightbox-close');

  galleryItems.forEach(item => {
    item.addEventListener('click', () => {
      const imgSrc = item.dataset.img;
      const caption = item.dataset.caption || '';
      lightboxImg.src = imgSrc;
      lightboxImg.alt = caption;
      lightboxCaption.textContent = caption;
      lightbox.classList.add('active');
    });
  });

  lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('active'); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) lightbox.classList.remove('active');
  });
</script>

</body>
</html>
